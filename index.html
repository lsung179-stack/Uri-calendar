<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우리 캘린더</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
html,body{background:#f7f5f2;min-height:100dvh}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1e1c18;max-width:430px;margin:0 auto;-webkit-font-smoothing:antialiased}

/* ── 로그인 화면 ── */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:32px 24px;gap:16px}
.login-screen.hide{display:none}
.login-logo{font-size:22px;font-weight:700;color:#1e1c18;display:flex;align-items:center;gap:6px}
.login-dot{width:6px;height:6px;border-radius:50%;background:#9a7240}
.login-title{font-size:24px;font-weight:700;color:#1e1c18;letter-spacing:-0.5px;text-align:center;margin-top:8px}
.login-sub{font-size:13px;color:#7a7368;text-align:center;line-height:1.8;font-weight:300}
.login-box{width:100%;background:#fff;border-radius:12px;border:1px solid rgba(180,170,155,0.4);padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 20px rgba(30,28,24,0.06)}
.login-box-title{font-size:12px;font-weight:700;color:#b0aaa0;letter-spacing:0.8px;text-align:center}
.or-divider{text-align:center;font-size:11px;color:#b0aaa0;margin:4px 0}

/* ── 메인 앱 ── */
.app{display:none}
.app.show{display:block}

/* 상단바 */
.topbar{position:sticky;top:0;z-index:90;background:rgba(247,245,242,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(180,170,155,0.4);padding:0 18px;height:54px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:700;color:#1e1c18;display:flex;align-items:center;letter-spacing:-0.3px}
.logo-dot{width:5px;height:5px;border-radius:50%;background:#9a7240;margin-left:5px;margin-bottom:1px;flex-shrink:0}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#4a9870;margin-left:5px;flex-shrink:0;transition:background 0.3s}
.sync-dot.err{background:#c04030}
.sync-dot.ing{background:#c0a030;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.top-icons{display:flex;gap:2px}
.icon-btn{width:36px;height:36px;border-radius:4px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:19px;height:19px;stroke:#7a7368;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* 멤버 탭 */
.member-strip{display:flex;border-bottom:1px solid rgba(180,170,155,0.3);background:#fff;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.member-strip::-webkit-scrollbar{display:none}
.m-tab{flex-shrink:0;padding:14px 16px;border:none;background:transparent;font-size:13px;font-weight:500;color:#b0aaa0;cursor:pointer;white-space:nowrap;letter-spacing:-0.2px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.m-tab.on{font-weight:700}

/* 캘린더 네비 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;background:#fff}
.period-wrap{display:flex;flex-direction:column;gap:2px}
.cal-period{font-size:26px;font-weight:300;color:#1e1c18;letter-spacing:-1px;line-height:1}
.cal-period b{font-weight:600}
.cal-sub{font-size:11px;color:#b0aaa0;letter-spacing:0.5px}
.cal-right{display:flex;align-items:center;gap:6px}
.view-toggle{display:flex;background:#efece7;border-radius:5px;padding:2px;gap:2px}
.vt-btn{padding:5px 12px;border-radius:4px;border:none;font-size:12px;font-weight:500;color:#7a7368;background:transparent;cursor:pointer;font-family:inherit}
.vt-btn.on{background:#fff;color:#1e1c18;font-weight:600;box-shadow:0 1px 3px rgba(60,50,30,0.1)}
.nav-arr{display:flex;gap:3px}
.arr-btn{width:30px;height:30px;border-radius:5px;border:1px solid rgba(180,170,155,0.5);background:#fff;color:#7a7368;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.oak-line{height:1px;background:linear-gradient(to right,transparent,rgba(196,151,90,0.4),transparent)}

/* 요일 */
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;background:#fff;border-bottom:1px solid rgba(180,170,155,0.3)}
.dow-row div{text-align:center;padding:6px 0;font-size:10px;font-weight:700;color:#b0aaa0;letter-spacing:0.8px}
.dow-row .sun{color:#c04030}.dow-row .sat{color:#3a68a0}

/* 월간 슬라이더 */
.monthly-wrap{overflow:hidden;position:relative;background:#f7f5f2}
.monthly-wrap.off{display:none}
.monthly-slider{display:flex;width:300%;transform:translateX(-33.333%);transition:transform 0.32s cubic-bezier(.4,0,.2,1);will-change:transform;align-items:flex-start}
.monthly-slider.no-tr{transition:none}
.monthly-panel{width:33.333%;flex-shrink:0;background:#f7f5f2}
.monthly-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 4px;background:#f7f5f2}
.m-cell{min-height:88px;background:#f7f5f2;border-top:1px solid rgba(180,165,145,0.28);padding:5px 3px 3px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.monthly-grid .m-cell:nth-child(-n+7){border-top:none}
.m-cell.dim{opacity:0.28;pointer-events:none}
.m-dnum{font-size:13px;font-weight:500;color:#1e1c18;padding:0 2px;line-height:1.7}
.m-cell.sun .m-dnum{color:#c04030}.m-cell.sat .m-dnum{color:#3a68a0}
.m-cell.holiday .m-dnum{color:#c04030;font-weight:700}
.m-cell.today .m-dnum{background:#c4975a;color:#fff !important;width:22px;height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:0}
.ev-bar{border-radius:3px;font-size:8.5px;font-weight:600;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.ev-hol{background:rgba(192,64,48,0.1);color:#c04030;font-weight:700}
.ev-more{font-size:8px;color:#b0aaa0;padding-left:2px}
.p-oak{background:#f0d4a8;color:#6b4010}.p-terr{background:#f0b8a0;color:#7a2810}
.p-sage{background:#a8d4b8;color:#1a5030}.p-stone{background:#d0ccc4;color:#3a3530}
.p-sand{background:#e8d89c;color:#5a4808}.p-slate{background:#a8c0d8;color:#1a3050}
.p-clay{background:#e8c0a0;color:#5a2a10}.p-moss{background:#b0d0a0;color:#1a4010}

/* 주간 */
.weekly-wrap{overflow:hidden;display:none}
.weekly-wrap.on{display:flex;flex-direction:column}
.weekly-inner{transition:opacity 0.22s}
.week-hdr{display:grid;grid-template-columns:44px repeat(7,1fr);border-bottom:1px solid rgba(180,170,155,0.4);background:#fff;padding:0 4px}
.wh-empty{padding:10px 0}
.wdc{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 2px;cursor:pointer;border-radius:4px}
.wdc-dow{font-size:9px;font-weight:700;color:#b0aaa0;letter-spacing:0.8px;margin-bottom:5px;text-align:center}
.wdc-dow.s{color:#c04030}.wdc-dow.sa{color:#3a68a0}
.wdc-d{font-size:18px;font-weight:300;color:#1e1c18;line-height:1;text-align:center}
.wdc.today-col .wdc-d{background:#c4975a;color:#fff;width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.week-body{flex:1;background:#f7f5f2;padding:0 0 80px}
.wdr{display:grid;grid-template-columns:44px 1fr;min-height:64px;border-bottom:1px solid rgba(180,170,155,0.25);background:#fff;margin-bottom:1px}
.wtl{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#1e1c18;background:#f7f5f2;border-right:1px solid rgba(180,170,155,0.3)}
.wea{padding:10px 12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;background:#fff}
.wea.ht{border-left:2px solid #c4975a;padding-left:10px}
.wei{padding:7px 10px;border-radius:4px;font-size:12px;color:#1e1c18;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid rgba(180,170,155,0.3);border-left:3px solid transparent}
.wed{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.wet{font-size:10px;color:#7a7368;min-width:32px;font-weight:300}
.wne{font-size:11px;color:#b0aaa0;padding:16px 0;font-weight:300}

/* 날짜 패널 */
.day-panel{display:none;position:fixed;inset:0;background:rgba(30,28,24,0.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;align-items:flex-end;justify-content:center}
.day-panel.on{display:flex;animation:fi 0.2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.dp-sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:430px;height:78dvh;padding:14px 18px 32px;position:relative;display:flex;flex-direction:column;animation:su 0.28s cubic-bezier(.25,1,.5,1);box-shadow:0 -8px 40px rgba(30,28,24,0.12)}
@keyframes su{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
.dp-handle{width:36px;height:3px;background:#d4d0ca;border-radius:99px;margin:0 auto 14px;flex-shrink:0}
.dp-close{position:absolute;top:14px;right:16px;background:#f0ece7;border:none;width:28px;height:28px;border-radius:4px;color:#7a7368;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dp-date{font-size:22px;font-weight:600;color:#1e1c18;margin-bottom:4px;letter-spacing:-0.5px;flex-shrink:0;line-height:1.2}
.dp-date em{font-style:normal;font-size:13px;color:#7a7368;font-weight:400;margin-left:8px}
.dp-hbadge{display:none;align-items:center;gap:5px;background:rgba(192,64,48,0.08);border:1px solid rgba(192,64,48,0.2);color:#c04030;border-radius:3px;padding:3px 8px;font-size:11px;font-weight:700;margin-bottom:12px;flex-shrink:0;width:fit-content}
.dp-hbadge::before{content:’’;width:5px;height:5px;border-radius:50%;background:#c04030;flex-shrink:0}
.dp-div{height:1px;background:rgba(180,170,155,0.3);margin-bottom:12px;flex-shrink:0}
.dp-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;flex:1;overflow-y:auto}
.dp-item{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:4px;background:#f7f5f2;border:1px solid rgba(180,170,155,0.25);border-left:3px solid transparent;flex-shrink:0}
.dp-bar{width:3px;height:34px;border-radius:99px;flex-shrink:0}
.dp-info{flex:1}
.dp-title{font-size:14px;font-weight:500;color:#1e1c18;letter-spacing:-0.2px}
.dp-time{font-size:11px;color:#7a7368;margin-top:2px;font-weight:300}
.dp-del{background:none;border:none;color:#b0aaa0;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:4px}
.dp-none{text-align:center;font-size:13px;color:#b0aaa0;font-weight:300;padding:28px 0;flex-shrink:0}
.dp-bot{flex-shrink:0}
.dp-add{width:100%;padding:13px;border-radius:4px;border:1px solid rgba(180,170,155,0.5);background:transparent;color:#7a7368;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.dp-add .pl{font-size:18px;font-weight:300;color:#9a7240;line-height:1}
.dp-form{display:none;flex-direction:column;gap:8px;margin-top:10px}
.dp-form.on{display:flex}

/* 입력 공통 */
.f-inp{width:100%;padding:11px 13px;background:#f7f5f2;border:1px solid rgba(180,170,155,0.5);border-radius:4px;color:#1e1c18;font-size:13px;outline:none;font-family:inherit;-webkit-appearance:none}
.f-inp:focus{border-color:#c4975a}
.f-inp::placeholder{color:#b0aaa0;font-weight:300}
.f-row{display:flex;gap:8px}.f-row .f-inp{flex:1}
.clr-row{display:flex;gap:7px;flex-wrap:wrap}
.clr-chip{width:26px;height:26px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:transform 0.12s,border-color 0.12s;flex-shrink:0}
.clr-chip.on{border-color:#1e1c18;transform:scale(1.15)}
.f-save{padding:12px;border-radius:4px;border:none;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit;background:#9a7240}

/* 모달 */
.overlay{display:none;position:fixed;inset:0;background:rgba(30,28,24,0.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:300;align-items:center;justify-content:center;padding:24px}
.overlay.on{display:flex;animation:fi 0.18s}
.modal{background:#fff;border:1px solid rgba(180,170,155,0.5);border-radius:12px;width:100%;max-width:340px;padding:24px 20px;animation:pi 0.22s cubic-bezier(.25,1,.5,1);box-shadow:0 20px 60px rgba(30,28,24,0.15);display:flex;flex-direction:column;gap:10px}
@keyframes pi{from{transform:scale(0.92) translateY(10px);opacity:0}to{transform:scale(1);opacity:1}}
.mo-title{font-size:18px;font-weight:700;text-align:center;color:#1e1c18;letter-spacing:-0.5px}
.mo-sub{font-size:12px;color:#7a7368;text-align:center;line-height:1.7;font-weight:300}
.mem-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.mem-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f7f5f2;border-radius:6px;border:1px solid rgba(180,170,155,0.3)}
.mem-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.mem-name{flex:1;font-size:14px;font-weight:500;color:#1e1c18}
.mem-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;background:#f0d4a8;color:#6b4010;flex-shrink:0}
.mem-kick{background:none;border:none;color:#b0aaa0;font-size:13px;cursor:pointer;padding:2px 6px;border-radius:4px}
.inv-wrap{background:#f7f5f2;border:1px solid rgba(196,151,90,0.4);border-radius:8px;padding:16px;text-align:center}
.inv-code{font-size:30px;font-weight:700;letter-spacing:8px;color:#9a7240;line-height:1}
.btn{width:100%;padding:12px;border-radius:6px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-oak{background:#9a7240;color:#fff}
.btn-kko{background:#FEE500;color:#3A1D1D;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-ghost{background:transparent;color:#7a7368;border:1px solid rgba(180,170,155,0.5) !important;font-weight:400}
.btn-danger{background:transparent;color:#c04030;border:1px solid rgba(192,64,48,0.3) !important;font-weight:400}
.btn-logout{background:transparent;color:#7a7368;border:none !important;font-size:12px;font-weight:400;padding:8px}

/* 프로필 선택 화면 */
.profile-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:32px 24px;gap:20px;background:#f7f5f2}
.profile-screen.show{display:flex}
.profile-title{font-size:22px;font-weight:700;color:#1e1c18;letter-spacing:-0.5px;text-align:center}
.profile-sub{font-size:13px;color:#7a7368;text-align:center;font-weight:300}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:320px}
.profile-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:12px 8px;border-radius:12px;border:2px solid transparent;transition:border-color 0.15s,transform 0.15s;-webkit-tap-highlight-color:transparent}
.profile-item:active{transform:scale(0.95)}
.profile-item.selected{border-color:#9a7240;background:#fff}
.profile-avatar{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;position:relative}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.profile-name{font-size:12px;font-weight:600;color:#1e1c18;text-align:center;letter-spacing:-0.2px}
.profile-owner{font-size:9px;color:#9a7240;font-weight:700;background:#f0d4a8;padding:1px 6px;border-radius:3px}
.profile-new{border:2px dashed rgba(180,170,155,0.5)}
.profile-new .profile-avatar{background:#efece7;color:#b0aaa0}
.profile-new .profile-name{color:#b0aaa0}
/* PIN 패드 */
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.pin-btn{height:52px;border-radius:8px;border:1px solid rgba(180,170,155,0.4);background:#f7f5f2;font-size:20px;font-weight:500;color:#1e1c18;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.1s;font-family:inherit}
.pin-btn:active{background:#efece7}
.pin-btn.del{font-size:16px;color:#7a7368}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #c4975a;background:transparent;transition:background 0.15s}
.pin-dot.filled{background:#c4975a}
/* 년/월 피커 */
.ym-item{padding:12px 16px;font-size:15px;color:#7a7368;cursor:pointer;text-align:center;transition:background 0.1s;font-weight:400}
.ym-item:active{background:#f0ece7}
.ym-item.sel{font-weight:700;color:#9a7240;background:#fdf8f2}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e1c18;color:#f7f5f2;padding:9px 18px;border-radius:99px;font-size:12px;z-index:999;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.2s;box-shadow:0 4px 18px rgba(30,28,24,0.3)}
.toast.on{opacity:1}
</style>

</head>
<body>

<!-- ── 로그인 화면 ── -->

<div class="login-screen" id="loginScreen">
  <!-- 3번 로고 -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:8px">
    <svg width="240" height="54" viewBox="0 0 240 54" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="32" x2="42" y2="32" stroke="rgba(196,151,90,0.35)" stroke-width="1"/>
      <line x1="198" y1="32" x2="240" y2="32" stroke="rgba(196,151,90,0.35)" stroke-width="1"/>
      <text x="120" y="30" text-anchor="middle" font-size="26" font-weight="300" fill="#1e1c18" letter-spacing="2" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif">우리 캘린더</text>
      <circle cx="120" cy="40" r="3" fill="#c4975a"/>
      <text x="120" y="52" text-anchor="middle" font-size="9.5" fill="#9a7240" letter-spacing="5" font-family="-apple-system,BlinkMacSystemFont,sans-serif">OUR  CALENDAR</text>
    </svg>
  </div>
  <div class="login-sub">방을 만들거나 초대 코드로 참여하세요</div>

  <!-- 새 방 만들기 -->

  <div class="login-box">
    <div class="login-box-title">새 방 만들기 (방장)</div>
    <input class="f-inp" id="createName" placeholder="내 이름" style="text-align:center">
    <button class="btn btn-oak" onclick="doCreate()">방 만들기</button>
  </div>

  <div class="or-divider">── 또는 ──</div>

  <!-- 초대코드로 참여 -->

  <div class="login-box">
    <div class="login-box-title">초대 코드로 참여 / 재입장</div>
    <input class="f-inp" id="joinCode" placeholder="초대 코드 6자리" style="text-align:center;letter-spacing:4px;font-size:16px;text-transform:uppercase" maxlength="6">
    <button class="btn btn-ghost" onclick="doShowProfiles()">다음 →</button>
  </div>
</div>

<!-- ── 프로필 선택 화면 ── -->

<div class="profile-screen" id="profileScreen">
  <svg width="200" height="48" viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg">
    <line x1="0" y1="27" x2="32" y2="27" stroke="rgba(196,151,90,0.35)" stroke-width="1"/>
    <line x1="168" y1="27" x2="200" y2="27" stroke="rgba(196,151,90,0.35)" stroke-width="1"/>

  const r=await fetch(SB_URL+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined})

function buildPinPad(padId,dotId,onInput){
  const pad=document.getElementById(padId),dots=document.getElementById(dotId)
  if(!pad||!dots)return
  pad.innerHTML='';dots.innerHTML=''
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='pin-dot';d.id=dotId+'_'+i;dots.appendChild(d)}
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(n=>{
    const btn=document.createElement('button');btn.className='pin-btn'+(n==='⌫'?' del':'');btn.textContent=n;btn.type='button'
    if(n==='')btn.style.visibility='hidden'
    else btn.onclick=()=>onInput(n,dotId)
    pad.appendChild(btn)
  })
}
function updatePinDots(dotId,buf){
  for(let i=0;i<4;i++){const d=document.getElementById(dotId+'_'+i);if(d)d.className='pin-dot'+(i<buf.length?' filled':'')}

function openPinSetup(onComplete){
  setupPinBuf=''
  setupPinCallback=onComplete
  buildPinPad('setupPinPad','setupPinDots',(n,dotId)=>{
    if(n==='⌫')setupPinBuf=setupPinBuf.slice(0,-1)
    else if(setupPinBuf.length<4)setupPinBuf+=n
    updatePinDots(dotId,setupPinBuf)
    if(setupPinBuf.length===4){
      closeModal('pinSetupMo')
      if(setupPinCallback)setupPinCallback(setupPinBuf)
    }
  })
  document.getElementById('pinSetupMo').classList.add('on')
}

    else if(verifyPinBuf.length<4)verifyPinBuf+=n

        closeModal('pinMo')

        setTimeout(()=>{document.getElementById('pinMoSub').textContent='4자리 PIN을 입력하세요'},1200)
      }
    }
  })
  document.getElementById('pinMo').classList.add('on')
}

/* ── 앱 시작 ── */
async function startApp(roomId,memberId,isOwner){
  myRoomId=roomId;myId=memberId;amOwner=isOwner
  await loadAll()
  curUser=memberId
  document.getElementById('loginScreen').classList.add('hide')
  document.getElementById('appWrap').classList.add('show')
  document.getElementById('invCode').textContent=myRoomId
  renderTabs()
  curY=NOW.getFullYear();curM=NOW.getMonth()
  renderMonthly()
  startWS()
}

async function loadAll(){
  const[mems,evList]=await Promise.all([
    api(`members?room_id=eq.${myRoomId}&order=created_at.asc`),
    api(`events?room_id=eq.${myRoomId}`)
  ])
  members=mems;evs={}
  mems.forEach(m=>{evs[m.id]={}})
  evList.forEach(e=>{
    if(!evs[e.member_id])evs[e.member_id]={}
    if(!evs[e.member_id][e.date])evs[e.member_id][e.date]=[]
    evs[e.member_id][e.date].push({id:e.id,title:e.title,time:e.time,color:e.color})
  })
}

/* ── 실시간 ── */
function startWS(){
  const ws=new WebSocket(`${SB_URL}/realtime/v1/websocket?apikey=${SB_KEY}&vsn=1.0.0`)
  ws.onopen=()=>{
    ws.send(JSON.stringify({topic:'realtime:public',event:'phx_join',payload:{config:{postgres_changes:[
      {event:'*',schema:'public',table:'events',filter:`room_id=eq.${myRoomId}`},
      {event:'*',schema:'public',table:'members',filter:`room_id=eq.${myRoomId}`}
    ]}},ref:'1'}))
    setSyncing('ok')
  }
  ws.onmessage=async e=>{
    try{
      const msg=JSON.parse(e.data)
      if(msg.payload?.data){
        setSyncing('ing')
        await loadAll()
        renderTabs()
        if(view==='monthly')renderMonthly();else renderWeekly()
        if(selDate)renderDpList()
        setSyncing('ok')
      }
    }catch(_){}
  }
  ws.onerror=()=>setSyncing('err')
  ws.onclose=()=>{setSyncing('err');setTimeout(startWS,3000)}
  setInterval(()=>{if(ws.readyState===1)ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'}))},25000)
}

/* ── 이동 (화살표 전용) ── */
function movePeriod(d){
  if(view==='weekly'){curWeekStart=addDays(curWeekStart,d*7);renderWeekly();return}
  if(isSliding)return
  isSliding=true
  const sl=document.getElementById('monthlySlider')
  const ue=evs[curUser]||{}
  if(d>0){
    curM+=1;if(curM>11){curM=0;curY++}
    fillPanel(document.getElementById('panelNext'),curY,curM,evs[curUser]||{})
    sl.style.transition='transform 0.32s cubic-bezier(.4,0,.2,1)'
    sl.style.transform='translateX(-66.666%)'
  }else{
    curM-=1;if(curM<0){curM=11;curY--}
    fillPanel(document.getElementById('panelPrev'),curY,curM,evs[curUser]||{})
    sl.style.transition='transform 0.32s cubic-bezier(.4,0,.2,1)'
    sl.style.transform='translateX(0%)'
  }
  updateHeader()
  sl.addEventListener('transitionend',()=>{
    resetSlider()
    isSliding=false
  },{once:true})
}

/* ── 월간 ── */
function buildCells(y,m){
  const fd=new Date(y,m,1).getDay(),dt=new Date(y,m+1,0).getDate()
  const pm=m===0?11:m-1,py=m===0?y-1:y,dp=new Date(py,pm+1,0).getDate()
  const nm=m===11?0:m+1,ny=m===11?y+1:y,c=[]
  for(let i=0;i<fd;i++)c.push({y:py,m:pm,d:dp-fd+1+i,dim:true})
  for(let d=1;d<=dt;d++)c.push({y,m,d,dim:false})
  let n=1;while(c.length%7!==0)c.push({y:ny,m:nm,d:n++,dim:true})
  return c
}
function fillPanel(el,y,m,ue){
  const g=document.createElement('div');g.className='monthly-grid'
  buildCells(y,m).forEach(c=>{
    const key=dk(c.y,c.m,c.d),dow=new Date(c.y,c.m,c.d).getDay()
    const isT=sameDay(new Date(c.y,c.m,c.d),NOW),arr=ue[key]||[],isH=!!HOLIDAYS[key]&&!c.dim
    const cell=document.createElement('div')
    cell.className=['m-cell',c.dim?'dim':'',isT?'today':'',dow===0?'sun':'',dow===6?'sat':'',isH?'holiday':''].filter(Boolean).join(' ')
    cell.onclick=()=>{if(!c.dim)openDay(key,c.y,c.m,c.d,dow)}
    const dn=document.createElement('div');dn.className='m-dnum';dn.textContent=c.d;cell.appendChild(dn)
    if(HOLIDAYS[key]&&!c.dim){const h=document.createElement('div');h.className='ev-bar ev-hol';h.textContent=HOLIDAYS[key];cell.appendChild(h)}
    arr.slice(0,2).forEach(ev=>{const b=document.createElement('div');b.className='ev-bar '+cPill(ev.color);b.textContent=ev.title;cell.appendChild(b)})
    if(arr.length>2){const x=document.createElement('div');x.className='ev-more';x.textContent=`+${arr.length-2}`;cell.appendChild(x)}
    g.appendChild(cell)
  })
  el.innerHTML='';el.appendChild(g)
}
function renderMonthly(){
  updateHeader()
  resetSlider()
}

/* ── 주간 ── */
function renderWeekly(){
  const inner=document.getElementById('weeklyInner'),days=Array.from({length:7},(_,i)=>addDays(curWeekStart,i))
  const s=days[0],e=days[6]
  if(s.getMonth()===e.getMonth()){document.getElementById('calPeriod').innerHTML=`<b>${s.getFullYear()}</b> ${MONKO[s.getMonth()]}`;document.getElementById('calSub').textContent=`${s.getDate()} — ${e.getDate()} ${MONK[s.getMonth()].slice(0,3).toUpperCase()}`}
  else{document.getElementById('calPeriod').innerHTML=`<b>${MONKO[s.getMonth()]}</b> — ${MONKO[e.getMonth()]}`;document.getElementById('calSub').textContent=`${s.getDate()} ${MONK[s.getMonth()].slice(0,3)} — ${e.getDate()} ${MONK[e.getMonth()].slice(0,3)}`}
  const wh=document.getElementById('weekHdr');wh.innerHTML=''
  const em=document.createElement('div');em.className='wh-empty';wh.appendChild(em)
  days.forEach(d=>{
    const col=document.createElement('div');col.className='wdc'
    const isT=sameDay(d,NOW),dow=d.getDay(),key=dk(d.getFullYear(),d.getMonth(),d.getDate()),isHol=!!HOLIDAYS[key]
    if(isT)col.classList.add('today-col')
    col.innerHTML=`<div class="wdc-dow ${dow===0||isHol?'s':dow===6?'sa':''}">${DOWK[dow].slice(0,2)}</div><div class="wdc-d" style="${dow===0||isHol?'color:#c04030':dow===6?'color:#3a68a0':''}">${d.getDate()}</div>`
    col.onclick=()=>openDay(key,d.getFullYear(),d.getMonth(),d.getDate(),dow);wh.appendChild(col)
  })
  const wb=document.getElementById('weekBody');wb.innerHTML=''
  const ue=evs[curUser]||{}
  days.forEach(d=>{
    const key=dk(d.getFullYear(),d.getMonth(),d.getDate()),arr=ue[key]||[],isT=sameDay(d,NOW),dow=d.getDay()
    const row=document.createElement('div');row.className='wdr'
    const tl=document.createElement('div');tl.className='wtl';tl.textContent=DOWKO[dow]
    if(dow===0||HOLIDAYS[key])tl.style.color='#c04030';else if(dow===6)tl.style.color='#3a68a0'
    row.appendChild(tl)
    const ea=document.createElement('div');ea.className='wea'+(isT?' ht':'')
    ea.onclick=()=>openDay(key,d.getFullYear(),d.getMonth(),d.getDate(),dow)
    if(!arr.length&&!HOLIDAYS[key]){const ne=document.createElement('div');ne.className='wne';ne.textContent='일정 없음';ea.appendChild(ne)}
    else{
      if(HOLIDAYS[key]){const hi=document.createElement('div');hi.className='wei';hi.style.borderLeftColor='#c04030';hi.innerHTML=`<div class="wed" style="background:#c04030"></div><div style="font-size:12px;font-weight:600;color:#c04030">${HOLIDAYS[key]}</div>`;ea.appendChild(hi)}
      arr.forEach(ev=>{const item=document.createElement('div');item.className='wei';item.style.borderLeftColor=cHex(ev.color);item.innerHTML=`<div class="wed" style="background:${cHex(ev.color)}"></div>${ev.time?`<div class="wet">${ev.time}</div>`:''}<div style="font-size:13px">${ev.title}</div>`;ea.appendChild(item)})
    }
    row.appendChild(ea);wb.appendChild(row)
  })
  inner.style.transition='none';inner.style.opacity='0'
  requestAnimationFrame(()=>requestAnimationFrame(()=>{inner.style.transition='opacity 0.22s';inner.style.opacity='1'}))
}

/* ── 초대 ── */
function openInvite(){document.getElementById('invCode').textContent=myRoomId;document.getElementById('invMo').classList.add('on')}
function copyCode(){navigator.clipboard?.writeText(myRoomId).then(()=>toast('코드가 복사됐어요')).catch(()=>{const t=document.createElement('textarea');t.value=myRoomId;t.style='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast('복사됐어요')})}
function shareKakao(){window.location.href=`kakaotalk://send?text=${encodeURIComponent(`우리 캘린더 초대!\n초대 코드: ${myRoomId}\n${location.href}`)}`;setTimeout(()=>{if(navigator.share)navigator.share({title:'우리 캘린더',text:`초대 코드: ${myRoomId}`}).catch(()=>copyCode());else copyCode()},700)}

function resetPin(){verifyPinBuf='';verifyMember=null}
const AK='uc6_avatars'
function getAvatars(){try{return JSON.parse(localStorage.getItem(AK))||{}}catch{return{}}}
function saveAvatarLocal(memberId,dataUrl){const a=getAvatars();a[memberId]=dataUrl;localStorage.setItem(AK,JSON.stringify(a))}
function getAvatar(memberId){return getAvatars()[memberId]||null}

let pendingAvatarData=null

function openAvatarMo(){
  pendingAvatarData=null
  document.getElementById('avatarInput').value=''
  const preview=document.getElementById('avatarPreview')
  const cur=getAvatar(myId)
  const me=members.find(m=>m.id===myId)
  if(cur){
    preview.style.background='transparent'
    preview.innerHTML=`<img src="${cur}" style="width:100%;height:100%;object-fit:cover;border-radius:20px">`
  }else{
    preview.innerHTML=''
    preview.style.background=me?.color||'#9a7240'
    preview.textContent=me?.name?.slice(0,1)||'?'
  }
  document.getElementById('avatarMo').classList.add('on')
}

function onAvatarChange(e){
  const file=e.target.files[0];if(!file)return
  // 용량 체크 (1MB 이하)
  if(file.size>1024*1024){toast('사진이 너무 커요. 1MB 이하로 선택해주세요');return}
  const reader=new FileReader()
  reader.onload=ev=>{
    pendingAvatarData=ev.target.result
    const preview=document.getElementById('avatarPreview')
    preview.style.background='transparent'
    preview.innerHTML=`<img src="${pendingAvatarData}" style="width:100%;height:100%;object-fit:cover;border-radius:20px">`
  }
  reader.onerror=()=>toast('사진 불러오기 실패')
  reader.readAsDataURL(file)
}

function removeAvatar(){
  pendingAvatarData='remove'
  const me=members.find(m=>m.id===myId)
  const preview=document.getElementById('avatarPreview')
  preview.innerHTML=''
  preview.style.background=me?.color||'#9a7240'
  preview.textContent=me?.name?.slice(0,1)||'?'
}

function saveAvatar(){
  try{
    if(pendingAvatarData==='remove'){
      const a=getAvatars();delete a[myId];localStorage.setItem(AK,JSON.stringify(a))
      closeModal('avatarMo');renderTabs();toast('프로필 사진이 삭제됐어요')
    }else if(pendingAvatarData){
      saveAvatarLocal(myId,pendingAvatarData)
      closeModal('avatarMo');renderTabs();toast('저장됐어요 ✓')
    }else{
      closeModal('avatarMo')
    }
  }catch(e){
    if(e.name==='QuotaExceededError'){toast('저장공간이 부족해요. 더 작은 사진을 선택해주세요')}
    else{toast('저장 실패: '+e.message.slice(0,30))}
  }
}

function getAvatarHTML(m,size=40){
  const av=getAvatar(m.id)
  if(av) return `<div style="width:${size}px;height:${size}px;border-radius:${size*0.25}px;overflow:hidden;flex-shrink:0"><img src="${av}" style="width:100%;height:100%;object-fit:cover"></div>`
  return `<div style="width:${size}px;height:${size}px;border-radius:${size*0.25}px;background:${m.color};display:flex;align-items:center;justify-content:center;font-size:${size*0.35}px;font-weight:700;color:#fff;flex-shrink:0">${m.name.slice(0,1)}</div>`
}
function closeModal(id){document.getElementById(id).classList.remove('on')}
document.querySelectorAll('.overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('on')}))
let _tt;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');if(_tt)clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('on'),3000)}

/* ── 스와이프 ── */
;(()=>{
  const targets=[document.getElementById('monthlyWrap'),document.getElementById('weeklyWrap')]
  let sx=0,sy=0,st=0,sw=false,dr=false
  function onS(e){
    if(isSliding)return
    const t=e.touches?e.touches[0]:e
    sx=t.clientX;sy=t.clientY;st=Date.now();sw=true;dr=false
  }
  function onM(e){
    if(!sw||view!=='monthly'||isSliding)return
    const t=e.touches?e.touches[0]:e,dx=t.clientX-sx,dy=t.clientY-sy
    if(!dr){
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5)dr=true
      else if(Math.abs(dy)>10){sw=false;return}
    }
    if(!dr)return
    e.preventDefault()
    const sl=document.getElementById('monthlySlider')
    sl.style.transition='none'
    sl.style.transform=`translateX(${-33.333+(dx/window.innerWidth*100)}%)`
  }
  function onE(e){
    if(!sw)return;sw=false
    if(!dr){dr=false;return}
    dr=false
    const t=e.changedTouches?e.changedTouches[0]:e
    const dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st
    if(view==='monthly'){
      if(Math.abs(dx)>50&&dt<500&&Math.abs(dy)<Math.abs(dx)*0.8){
        swipeFinish(dx<0?1:-1)
      }else{
        const sl=document.getElementById('monthlySlider')
        sl.style.transition='transform 0.28s cubic-bezier(.4,0,.2,1)'
        sl.style.transform='translateX(-33.333%)'
      }
    }else if(view==='weekly'&&Math.abs(dx)>40&&Math.abs(dy)<Math.abs(dx)*0.6&&dt<400){
      curWeekStart=addDays(curWeekStart,(dx<0?1:-1)*7);renderWeekly()
    }
  }
  targets.forEach(el=>{
    if(!el)return
    el.addEventListener('touchstart',onS,{passive:true})
    el.addEventListener('touchmove',onM,{passive:false})
    el.addEventListener('touchend',onE,{passive:true})
  })
})()

/* ── 시작 ── */
;(async()=>{
  const sess=loadSess()
  if(!sess)return

  document.getElementById('loginScreen').style.opacity='0.5'
  try{
    await startApp(sess.roomId,sess.memberId,sess.isOwner)
  }catch(e){
    document.getElementById('loginScreen').style.opacity='1'
    toast('연결 실패. 다시 시도해주세요')
  }
})()
